<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="options.css">
    <script type="module" src="options.js"></script>
</head>

<body>
    <form>
        <label for="fontFamily" data-i18n-content="fontFamilyOption"></label>
        <input type="text" id="fontFamily" name="fontFamily"
            placeholder="Calibri, 'Droid Sans', Helvetica, sans-serif" size="50">
        <p class="option_help" data-i18n-content="fontFamilyHelp"></p>
        <label for="fontSize" data-i18n-content="fontSizeOption"></label>
        <input type="text" id="fontSize" name="fontSize"
            placeholder="11pt" size="6">
        <p class="option_help" data-i18n-content="fontSizeHelp"></p>
    </form>
</body>

</html>
